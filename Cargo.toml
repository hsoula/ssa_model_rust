[package]
name = "ssa_model"
version = "1.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
rand = "0.10.0-rc.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serde_with = "3.16.0"
tempfile = "3.23.0"
once_cell = "1.21.3"
petgraph = "0.8.3"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[[bin]]
name = "evolve"
path = "src/bin/evolve.rs"

[[bin]]
name = "evolve_target"
path = "src/bin/evolve_target.rs"

[[bin]]
name = "gen_chemistry"
path = "src/bin/gen_chemistry.rs"

[[bin]]
name = "gen_molecules"
path = "src/bin/gen_molecules.rs"

[[bin]]
name = "mol_genome_test"
path = "src/bin/mol_genome_test.rs"

[[bin]]
name = "mol_genome_reactor"
path = "src/bin/mol_genome_reactor.rs"

[[bin]]
name = "genome_test"
path = "src/bin/genome_test.rs"

[[bin]]
name = "gene_doc"
path = "src/bin/gene_doc.rs"

[[bin]]
name = "mol_distances"
path = "src/bin/mol_distances.rs"

[[bin]]
name = "reactions_to_md"
path = "src/bin/reactions_to_md.rs"

[[bin]]
name = "report_run"
path = "src/bin/report_run.rs"

[[bin]]
name = "simple_ga"
path = "src/bin/simple_ga.rs"

[[bin]]
name = "bacterium"
path = "src/bin/bacterium.rs"
